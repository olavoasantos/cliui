<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="header">⚡ Vite + Terminal DOM — HMR Demo</div>
      <div class="status" id="status">Loading...</div>
      <div class="card">
        <div class="label">Try editing:</div>
        <div class="value">• styles.css — changes hot-reload without restart</div>
        <div class="value">• index.html — changes trigger a full reload</div>
      </div>
      <div class="card" id="clock">
        <div class="label">Clock</div>
        <div class="value" id="time">--:--:--</div>
      </div>
      <div class="footer">Press 'q' to exit</div>
    </div>
    <script>
      document.querySelector('#status').textContent = 'Ready!';

      function updateClock() {
        document.querySelector('#time').textContent = new Date().toLocaleTimeString();
      }
      updateClock();
      setInterval(updateClock, 1000);

      document.body.addEventListener('keydown', function(e) {
        if (e.key === 'q') terminal.exit();
      });
    </script>
  </body>
</html>
